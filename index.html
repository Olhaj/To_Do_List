<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app_to_do_list">
        <div class="data">
            <h2>Среда</h2>
            <p>3 января </p>
        </div>
        <div class="search">
            <p>Поиск</p>
            <img src="assest/icons/magnifying_glass.svg" alt="Magnifying glass">
        </div>
        <div class="active_status">
            <p>Все</p>
            <p>Активные</p>
            <p>Завершенные</p>
        </div>
        <div class="what_to_do">
            <div class="box_tasks">
                <img src="assest/icons/boxing_is_done.svg" alt="Boxing is done">
                <p>10 января, 11:30</p>
                <p>Покормить кошку</p>
            </div>
            <div class="box_tasks">
                <img src="assest/icons/Checkboxes.svg" alt="Checkboxes">
                <p>10 января, 11:30</p>
                <p>Покормить кошку</p>
            </div>
            <div class="box_tasks">
                <img src="assest/icons/Checkboxes.svg" alt="Checkboxes">
                <p>10 января, 11:30</p>
                <p>Покормить кошку</p>
            </div>
            <div class="box_tasks">
                <img src="assest/icons/Checkboxes.svg" alt="Checkboxes">
                <p>10 января, 11:30</p>
                <p>Покормить кошку</p>
            </div>
        </div>
        <div class="new_task">
            <img src="assest/icons/pen.svg" alt="Pen">
        </div>
    </div>
</body>
<script src="scripts/script.js"></script>

</html>
